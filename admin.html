<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Resolve AI — Admin Dashboard</title>
<style>
  body{margin:0;background:#06080b;color:#eae6de;font-family:-apple-system,sans-serif;padding:32px}
  h1{font-size:18px;letter-spacing:2px;text-transform:uppercase;margin-bottom:24px}
  .stats{display:grid;grid-template-columns:repeat(5,1fr);gap:1px;background:rgba(255,255,255,0.08);margin-bottom:28px}
  .stat{background:#0d1117;padding:18px}
  .stat-num{font-size:26px;font-weight:800}
  .stat-num.red{color:#e03020}
  .stat-num.gold{color:#d4a843}
  .stat-label{font-size:10px;letter-spacing:1px;text-transform:uppercase;color:rgba(234,230,222,0.4);margin-top:6px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:8px 12px;border-bottom:1px solid rgba(255,255,255,0.06)}
  th{color:rgba(234,230,222,0.4);font-size:10px;letter-spacing:1px;text-transform:uppercase}
  .err{color:#e03020}
  .flag{color:#e03020;font-weight:700}
</style>
</head>
<body>
  <h1>Resolve AI — Usage Dashboard</h1>
  <div id="content">Loading…</div>

<script>
async function load() {
  const res = await fetch('/api/admin-stats');
  const content = document.getElementById('content');
  if (!res.ok) {
    const data = await res.json().catch(() => ({}));
    content.innerHTML = `<div class="err">Failed to load: ${data.error || res.status}</div>`;
    return;
  }
  const { rows } = await res.json();

  const total = rows.length;
  const errors = rows.filter(r => r.had_error).length;
  const legal = rows.filter(r => r.legal_threat).length;
  const viral = rows.filter(r => r.viral_risk).length;
  const safety = rows.filter(r => r.safety_concern).length;

  const tableRows = rows.slice(0, 200).map(r => `
    <tr>
      <td>${new Date(r.created_at).toLocaleString()}</td>
      <td>${r.channel || '—'}</td>
      <td>${r.issue_category || '—'}</td>
      <td>${r.urgency_level || '—'}</td>
      <td>${r.legal_threat ? '<span class="flag">LEGAL</span>' : ''} ${r.viral_risk ? '<span class="flag">VIRAL</span>' : ''} ${r.safety_concern ? '<span class="flag">SAFETY</span>' : ''}</td>
      <td>${r.had_error ? '<span class="err">ERROR: ' + (r.error_message || '') + '</span>' : 'OK'}</td>
    </tr>`).join('');

  content.innerHTML = `
    <div class="stats">
      <div class="stat"><div class="stat-num">${total}</div><div class="stat-label">Total Requests</div></div>
      <div class="stat"><div class="stat-num red">${errors}</div><div class="stat-label">Errors</div></div>
      <div class="stat"><div class="stat-num gold">${legal}</div><div class="stat-label">Legal Threats</div></div>
      <div class="stat"><div class="stat-num gold">${viral}</div><div class="stat-label">Viral Risk</div></div>
      <div class="stat"><div class="stat-num red">${safety}</div><div class="stat-label">Safety Concerns</div></div>
    </div>
    <table>
      <thead><tr><th>Time</th><th>Channel</th><th>Category</th><th>Urgency</th><th>Flags</th><th>Status</th></tr></thead>
      <tbody>${tableRows}</tbody>
    </table>
  `;
}
load();
</script>
</body>
</html>
