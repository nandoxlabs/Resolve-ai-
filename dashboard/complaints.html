<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complaints Workspace | Resolve AI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-layout">
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="logo">Resolve AI</div>
            </div>
            <ul class="nav-links">
                <li><a href="complaints.html" class="active">Intelligence Workspace</a></li>
                <li><a href="admin.html">Admin Settings</a></li>
            </ul>
        </aside>

        <main class="main-content">
            <header class="top-header">
                <h1 class="page-title">Process New Complaint</h1>
            </header>

            <div class="workspace-container">
                <div class="card">
                    <h3>Paste Customer Complaint</h3>
                    <textarea id="complaint-input" class="text-input" placeholder="Paste the customer's email or message here..." rows="5"></textarea>
                    <button id="btn-analyze" class="btn btn-primary" style="margin-top: 16px;">Analyze with AI</button>
                </div>

                <div id="ai-results" class="card hidden" style="margin-top: 24px; border: 1px solid #0070F3; background-color: #f0f7ff;">
                    <h3 style="color: #0070F3;">✨ AI Intelligence Report</h3>
                    <div class="results-grid" style="margin-top: 16px;">
                        <p><strong>Category:</strong> <span id="res-category" class="badge badge-medium">-</span></p>
                        <p><strong>Sentiment:</strong> <span id="res-sentiment" class="badge badge-critical">-</span></p>
                        <p style="margin-top: 12px;"><strong>AI Summary:</strong> <span id="res-summary"></span></p>
                        <p style="margin-top: 12px;"><strong>Root Cause:</strong> <span id="res-rootcause"></span></p>
                        <p style="margin-top: 12px;"><strong>Suggested Action:</strong> <span id="res-action"></span></p>
                    </div>
                    <button id="btn-execute" class="btn btn-primary" style="margin-top: 20px; width: 100%;">Execute Resolution</button>
                </div>
            </div>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
